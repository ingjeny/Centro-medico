services:
  backend:
    image: brendarios07/consultorio-backend:latest
    container_name: consultorio-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST:-169.58.241.118}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-consultorio_web}
      - DB_PASSWORD=${DB_PASSWORD:-Consultorio2026}
      - DB_NAME=${DB_NAME:-consultorio}
      - JWT_SECRET=${JWT_SECRET:-coagro_2026_super_secret_consultorio}
    volumes:
      - consultorio_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - consultorio-net

  frontend:
    image: brendarios07/consultorio-frontend:latest
    container_name: consultorio-frontend
    restart: unless-stopped
    ports:
      - "${PORT_WEB:-8080}:80"
    depends_on:
      - backend
    networks:
      - consultorio-net

volumes:
  consultorio_uploads:
    name: consultorio_uploads

networks:
  consultorio-net:
    driver: bridge
